<style>#flask-auth-overlay{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.6)}#flask-auth-overlay.open{display:flex}#flask-auth-card{width:100%;max-width:430px;background:#fff;border-radius:24px;box-shadow:0 25px 60px rgba(0,0,0,.25);overflow:hidden;font-family:Cairo,sans-serif}#flask-auth-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:#6d28d9;color:#fff}#flask-auth-head button{border:0;background:transparent;color:#fff;font-size:22px;cursor:pointer}#flask-auth-body{padding:22px}#flask-auth-body p{font-size:12px;color:#64748b;line-height:1.8;margin:0 0 12px}#flask-auth-body input,#flask-auth-body select{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #e2e8f0;border-radius:12px;font-family:inherit;font-size:13px;outline:none;margin-bottom:9px}#flask-auth-body button.primary{width:100%;padding:12px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font-family:inherit;font-weight:800;cursor:pointer}#flask-auth-body button.secondary{width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;color:#334155;font-family:inherit;font-weight:700;cursor:pointer;margin-top:8px}#flask-auth-body button:disabled{opacity:.55;cursor:not-allowed}#flask-auth-msg{font-size:12px;min-height:18px;margin:0 0 10px;color:#64748b}#flask-auth-msg.error{color:#dc2626}#flask-auth-msg.success{color:#059669}#flask-auth-profile{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:420px){#flask-auth-card{max-width:100%}}</style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased selection:bg-rose-500 selection:text-white font-['Cairo',sans-serif]">
<div id="root"></div>
<div id="flask-auth-overlay" aria-hidden="true"><div id="flask-auth-card" role="dialog" aria-modal="true"><div id="flask-auth-head"><strong id="flask-auth-title">الدخول برقم الهاتف</strong><button id="flask-auth-close" aria-label="إغلاق">×</button></div><div id="flask-auth-body"><div id="flask-auth-msg"></div><div id="flask-auth-content"></div></div></div></div>
<script type="module">
const API='https://whats.alattab.site',TOKEN='takhfid_access_token',USER='altakhfid_user';
const GOVS=['عدن','حضرموت','شبوة','المهرة','لحج','أبين','الضالع','سقطرى','صنعاء','أمانة العاصمة','تعز','إب','الحديدة','ذمار','مأرب','صعدة','حجة','عمران','البيضاء','الجوف','المحويت','ريمة'];
const $=id=>document.getElementById(id),overlay=$('flask-auth-overlay'),title=$('flask-auth-title'),content=$('flask-auth-content'),msg=$('flask-auth-msg');let s={step:'phone',phone:'',otp:'',cooldown:0,busy:false,user:null,timer:null};
const norm=v=>{let d=(v||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='967'+d.slice(1);if(d.length===9&&d.startsWith('7'))d='967'+d;return d};
const setMsg=(t,c='')=>{msg.textContent=t||'';msg.className=c}; const busy=b=>{s.busy=b;content.querySelectorAll('button,input,select').forEach(x=>x.disabled=b)};
async function api(p,o={}){const h={'Accept':'application/json','Content-Type':'application/json',...(o.headers||{})},t=localStorage.getItem(TOKEN);if(t)h.Authorization='Bearer '+t;const r=await fetch(API+p,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.message||('HTTP '+r.status));return d}
function render(){if(s.step==='account'){title.textContent='الملف الشخصي';const u=s.user||{};content.innerHTML='<div style="background:#f5f3ff;border:1px solid #ede9fe;padding:14px;border-radius:16px;margin-bottom:12px"><b>'+(u.firstName||'حساب العميل')+' '+(u.secondName||'')+' '+(u.lastName||'')+'</b><div style="font-size:11px;color:#64748b;margin-top:4px">'+(u.phone||'')+'</div>'+(u.isAdmin?'<div style="font-size:10px;color:#92400e;margin-top:6px">مدير المتجر</div>':'')+'</div><button id="fa-logout" class="secondary">تسجيل الخروج</button>';$('fa-logout').onclick=logout;return}if(s.step==='phone'){title.textContent='الدخول برقم الهاتف';content.innerHTML='<p>أدخل رقم الهاتف فقط، وسيصلك رمز التحقق من خادم المتجر عبر واتساب.</p><input id="fa-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="رقم الهاتف"><button id="fa-send" class="primary">إرسال رمز واتساب</button>';$('fa-phone').value=s.phone;$('fa-phone').oninput=e=>s.phone=e.target.value;$('fa-send').onclick=requestOtp;return}if(s.step==='otp'){title.textContent='التحقق من الرمز';content.innerHTML='<p>أدخل الرمز الذي وصل إلى <b>'+s.phone+'</b>.</p><input id="fa-otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" style="text-align:center;font-size:20px;letter-spacing:.4em;font-weight:900"><button id="fa-verify" class="primary">تحقق من الرمز</button><button id="fa-resend" class="secondary">'+(s.cooldown>0?'إعادة الإرسال بعد '+s.cooldown+'ث':'إعادة إرسال الرمز')+'</button>';$('fa-otp').value=s.otp;$('fa-otp').oninput=e=>s.otp=e.target.value.replace(/\D/g,'').slice(0,6);$('fa-verify').onclick=verify;$('fa-resend').onclick=requestOtp;if(s.cooldown>0){$('fa-resend').disabled=true;clearInterval(s.timer);s.timer=setInterval(()=>{s.cooldown=Math.max(0,s.cooldown-1);render()},1000)}return}title.textContent='إكمال بيانات الحساب';content.innerHTML='<div style="background:#fffbeb;border:1px solid #fef3c7;padding:9px;border-radius:12px;color:#92400e;font-size:11px;margin-bottom:9px">تم التحقق من رقمك. أكمل البيانات مرة واحدة للحساب الجديد.</div><div id="flask-auth-profile"><input id="fa-first" placeholder="الاسم الأول *"><input id="fa-second" placeholder="اسم الأب"><input id="fa-third" placeholder="اسم الجد"><input id="fa-last" placeholder="العائلة"></div><select id="fa-gov">'+GOVS.map(g=>'<option>'+g+'</option>').join('')+'</select><button id="fa-profile" class="primary">حفظ البيانات وإنشاء الحساب</button>';$('fa-profile').onclick=completeProfile}
function open(){try{s.user=JSON.parse(localStorage.getItem(USER)||'null')}catch{s.user=null}s.step=s.user?'account':'phone';s.phone='';s.otp='';s.cooldown=0;overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');render()};function close(){clearInterval(s.timer);overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true')}
async function requestOtp(){const p=norm(s.phone);if(!/^\d{8,15}$/.test(p)){setMsg('رقم الهاتف غير صالح. استخدم الرقم الدولي أو الرقم اليمني المحلي.','error');return}s.phone=p;busy(true);setMsg('جاري إرسال رمز التحقق...');try{const r=await api('/takhfid/api/auth/send-otp',{method:'POST',body:JSON.stringify({phoneNumber:p})});s.step='otp';s.cooldown=r.retryAfterSeconds||60;render();setMsg('تم إرسال رمز التحقق عبر واتساب ✅','success')}catch(e){setMsg(e.message||'تعذر إرسال رمز التحقق عبر واتساب','error')}finally{s.busy=false}}
async function verify(){if(!/^\d{6}$/.test(s.otp)){setMsg('رمز التحقق يجب أن يتكون من 6 أرقام','error');return}busy(true);setMsg('جاري التحقق...');try{const r=await api('/takhfid/api/v2/auth/login-verify',{method:'POST',body:JSON.stringify({phoneNumber:s.phone,otp:s.otp})});localStorage.setItem(TOKEN,r.accessToken);if(r.needsProfile){s.step='profile';render();setMsg('تم التحقق من الرقم. أكمل بيانات حسابك مرة واحدة.','success');return}localStorage.setItem(USER,JSON.stringify(r.user));close();location.reload()}catch(e){setMsg(e.message||'رمز التحقق غير صحيح أو منتهي الصلاحية','error')}finally{s.busy=false}}
async function completeProfile(){const f=($('fa-first').value||'').trim(),a=($('fa-second').value||'').trim(),g=($('fa-third').value||'').trim(),l=($('fa-last').value||'').trim(),v=$('fa-gov').value;if(!f){setMsg('أدخل الاسم الأول','error');return}busy(true);setMsg('جاري حفظ بيانات الحساب...');try{const r=await api('/takhfid/api/v2/auth/complete-profile',{method:'POST',body:JSON.stringify({firstName:f,secondName:a||undefined,thirdName:g||undefined,lastName:l||undefined,governorate:v})});localStorage.setItem(USER,JSON.stringify(r.user));close();location.reload()}catch(e){setMsg(e.message||'تعذر حفظ بيانات الحساب على الخادم','error')}finally{s.busy=false}}
async function logout(){busy(true);try{await api('/takhfid/api/v2/auth/session-revoke',{method:'POST'})}catch(e){}localStorage.removeItem(TOKEN);localStorage.removeItem(USER);close();location.reload()}
$('flask-auth-close').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
document.addEventListener('click',e=>{const el=e.target.closest?.('button[aria-label="الحساب"]');if(!el)return;e.preventDefault();e.stopImmediatePropagation();open()},true);
(async()=>{const t=localStorage.getItem(TOKEN);if(!t||localStorage.getItem(USER))return;try{const r=await api('/takhfid/api/v2/auth/me');if(r.user){localStorage.setItem(USER,JSON.stringify(r.user));location.reload()}}catch(e){localStorage.removeItem(TOKEN)}})();
</script>
