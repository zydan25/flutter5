<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="التخفيض الصح">
<title>التخفيض الصح - متجر الملابس والعروض الكبرى</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./assets/index-DqlAnH_M.css">
<style>
#flask-auth-overlay{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.62);font-family:Cairo,Tajawal,sans-serif}
#flask-auth-overlay.open{display:flex}
#flask-auth-card{width:min(430px,100%);background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.35)}
#flask-auth-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#6d28d9;color:#fff}
#flask-auth-head button{border:0;background:transparent;color:#fff;font-size:28px;line-height:1;cursor:pointer}
#flask-auth-body{padding:20px}
#flask-auth-body p{font-size:13px;color:#64748b;line-height:1.8;margin:0 0 12px}
#flask-auth-body input,#flask-auth-body select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #e2e8f0;border-radius:12px;font-family:inherit;font-size:14px;margin-bottom:10px;outline:none}
#flask-auth-body button.primary{width:100%;padding:12px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font-family:inherit;font-weight:800;cursor:pointer}
#flask-auth-body button.secondary{width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;color:#334155;font-family:inherit;font-weight:700;cursor:pointer;margin-top:8px}
#flask-auth-body button:disabled{opacity:.55;cursor:not-allowed}
#flask-auth-msg{min-height:20px;margin-bottom:10px;font-size:12px;color:#64748b}
#flask-auth-msg.error{color:#dc2626}.success{color:#059669!important}
#flask-auth-profile{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div id="root"></div>
<div id="flask-auth-overlay" aria-hidden="true"><div id="flask-auth-card" role="dialog" aria-modal="true"><div id="flask-auth-head"><strong id="flask-auth-title">الدخول برقم الهاتف</strong><button id="flask-auth-close" type="button" aria-label="إغلاق">×</button></div><div id="flask-auth-body"><div id="flask-auth-msg"></div><div id="flask-auth-content"></div></div></div></div>
<script type="module">
const API='https://whats.alattab.site',TOKEN='takhfid_access_token',USER='altakhfid_user';
const GOVS=['عدن','حضرموت','شبوة','المهرة','لحج','أبين','الضالع','سقطرى','صنعاء','أمانة العاصمة','تعز','إب','الحديدة','ذمار','مأرب','صعدة','حجة','عمران','البيضاء','الجوف','المحويت','ريمة'];
const $=id=>document.getElementById(id), overlay=$('flask-auth-overlay'), title=$('flask-auth-title'), content=$('flask-auth-content'), msg=$('flask-auth-msg');
let s={step:'phone',phone:'',otp:'',cooldown:0,busy:false,user:null,timer:null};
const norm=v=>{let d=(v||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='967'+d.slice(1);if(d.length===9&&d.startsWith('7'))d='967'+d;return d};
const setMsg=(t,c='')=>{msg.textContent=t||'';msg.className=c};
const setBusy=b=>{s.busy=b;content.querySelectorAll('button,input,select').forEach(x=>x.disabled=b)};
async function api(path,opt={}){const h={'Accept':'application/json','Content-Type':'application/json',...(opt.headers||{})};const t=localStorage.getItem(TOKEN);if(t)h.Authorization='Bearer '+t;const r=await fetch(API+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.message||`HTTP ${r.status}`);return d}
function render(){
 if(s.step==='account'){title.textContent='حسابي';const u=s.user||{};content.innerHTML=`<div style="background:#f5f3ff;border:1px solid #ede9fe;padding:14px;border-radius:16px;margin-bottom:12px"><b>${[u.firstName,u.secondName,u.thirdName,u.lastName].filter(Boolean).join(' ')||'حساب العميل'}</b><div style="font-size:11px;color:#64748b;margin-top:5px">${u.phone||s.phone||''}</div></div><button id="fa-logout" class="secondary">تسجيل الخروج</button>`;$('fa-logout').onclick=logout;return}
 if(s.step==='phone'){title.textContent='الدخول برقم الهاتف';content.innerHTML='<p>لا توجد كلمة مرور ولا تسجيل منفصل. أدخل رقم هاتفك وسيصلك رمز التحقق عبر واتساب من خادم Flask.</p><input id="fa-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="مثال: 777123456"><button id="fa-send" class="primary">إرسال رمز واتساب</button>';$('fa-phone').value=s.phone;$('fa-phone').oninput=e=>s.phone=e.target.value;$('fa-send').onclick=requestOtp;return}
 if(s.step==='otp'){title.textContent='التحقق من واتساب';content.innerHTML=`<p>أدخل رمز التحقق المرسل إلى <b>${s.phone}</b>.</p><input id="fa-otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" style="text-align:center;font-size:22px;letter-spacing:.4em;font-weight:900"><button id="fa-verify" class="primary">تحقق من الرمز</button><button id="fa-resend" class="secondary">${s.cooldown>0?'إعادة الإرسال بعد '+s.cooldown+'ث':'إعادة إرسال الرمز'}</button>`;$('fa-otp').value=s.otp;$('fa-otp').oninput=e=>s.otp=e.target.value.replace(/\D/g,'').slice(0,6);$('fa-verify').onclick=verify;$('fa-resend').onclick=requestOtp;if(s.cooldown>0){$('fa-resend').disabled=true;clearInterval(s.timer);s.timer=setInterval(()=>{s.cooldown=Math.max(0,s.cooldown-1);if(s.cooldown===0)clearInterval(s.timer);render()},1000)}return}
 title.textContent='إكمال الحساب';content.innerHTML='<div style="background:#fffbeb;border:1px solid #fef3c7;padding:10px;border-radius:12px;color:#92400e;font-size:11px;margin-bottom:10px">تم التحقق من رقم الهاتف. أكمل البيانات مرة واحدة.</div><div id="flask-auth-profile"><input id="fa-first" placeholder="الاسم الأول *"><input id="fa-second" placeholder="اسم الأب"><input id="fa-third" placeholder="اسم الجد"><input id="fa-last" placeholder="العائلة"></div><select id="fa-gov">'+GOVS.map(g=>`<option>${g}</option>`).join('')+'</select><button id="fa-profile" class="primary">حفظ وإنشاء الحساب</button>';$('fa-profile').onclick=completeProfile;
}
function openAuth(){try{s.user=JSON.parse(localStorage.getItem(USER)||'null')}catch{s.user=null}s.step=s.user?'account':'phone';s.phone='';s.otp='';s.cooldown=0;clearInterval(s.timer);overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');render();setTimeout(()=>content.querySelector('input')?.focus(),50)}
function closeAuth(){clearInterval(s.timer);overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true')}
async function requestOtp(){const p=norm(s.phone);if(!/^\d{8,15}$/.test(p)){setMsg('رقم الهاتف غير صالح.','error');return}s.phone=p;setBusy(true);setMsg('جاري إرسال رمز التحقق...');try{const r=await api('/takhfid/api/auth/send-otp',{method:'POST',body:JSON.stringify({phoneNumber:p})});s.step='otp';s.cooldown=r.retryAfterSeconds||60;render();setMsg('تم إرسال رمز التحقق عبر واتساب ✅','success')}catch(e){setMsg(e.message||'تعذر إرسال الرمز','error')}finally{s.busy=false;content.querySelectorAll('button,input,select').forEach(x=>x.disabled=false)}}
async function verify(){if(!/^\d{6}$/.test(s.otp)){setMsg('الرمز يجب أن يتكون من 6 أرقام.','error');return}setBusy(true);setMsg('جاري التحقق...');try{const r=await api('/takhfid/api/v2/auth/login-verify',{method:'POST',body:JSON.stringify({phoneNumber:s.phone,otp:s.otp})});if(!r.accessToken)throw new Error('لم يُرجع الخادم رمز الدخول');localStorage.setItem(TOKEN,r.accessToken);if(r.needsProfile){s.step='profile';render();setMsg('تم التحقق. أكمل بياناتك مرة واحدة.','success');return}localStorage.setItem(USER,JSON.stringify(r.user||{}));closeAuth();location.reload()}catch(e){setMsg(e.message||'تعذر التحقق من الرمز','error')}finally{s.busy=false;content.querySelectorAll('button,input,select').forEach(x=>x.disabled=false)}}
async function completeProfile(){const f=($('fa-first').value||'').trim(),a=($('fa-second').value||'').trim(),g=($('fa-third').value||'').trim(),l=($('fa-last').value||'').trim(),v=$('fa-gov').value;if(!f){setMsg('أدخل الاسم الأول.','error');return}setBusy(true);setMsg('جاري حفظ البيانات...');try{const r=await api('/takhfid/api/v2/auth/complete-profile',{method:'POST',body:JSON.stringify({firstName:f,secondName:a||undefined,thirdName:g||undefined,lastName:l||undefined,governorate:v})});localStorage.setItem(USER,JSON.stringify(r.user||{}));closeAuth();location.reload()}catch(e){setMsg(e.message||'تعذر حفظ البيانات','error')}finally{s.busy=false;content.querySelectorAll('button,input,select').forEach(x=>x.disabled=false)}}
async function logout(){setBusy(true);try{await api('/takhfid/api/v2/auth/session-revoke',{method:'POST'})}catch(e){}localStorage.removeItem(TOKEN);localStorage.removeItem(USER);closeAuth();location.reload()}
$('flask-auth-close').onclick=closeAuth;overlay.addEventListener('click',e=>{if(e.target===overlay)closeAuth()});
function isAuthTrigger(el){let n=el?.closest?.('[aria-label],[title],button,a,[role="button"]')||el;let txt=((n?.getAttribute?.('aria-label')||'')+' '+(n?.getAttribute?.('title')||'')+' '+(n?.textContent||'')).replace(/\s+/g,' ');return /الحساب|تسجيل الدخول|دخول|login/i.test(txt)}
document.addEventListener('click',e=>{if(!isAuthTrigger(e.target))return;if(overlay.contains(e.target))return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();openAuth()},true);
function hideLegacyAuth(){document.querySelectorAll('input[type="password"]').forEach(inp=>{let p=inp;for(let i=0;i<8&&p;i++,p=p.parentElement){const cs=getComputedStyle(p);if(cs.position==='fixed'||cs.position==='absolute'||p.getAttribute('role')==='dialog'){p.style.setProperty('display','none','important');openAuth();break}}});document.querySelectorAll('[role="dialog"],body>div').forEach(el=>{if(el.id==='flask-auth-overlay')return;const cs=getComputedStyle(el);if(cs.display==='none'||cs.visibility==='hidden')return;const t=(el.textContent||'').replace(/\s+/g,' ');if((/كلمة المرور|تسجيل جديد|إنشاء حساب/.test(t))&&(cs.position==='fixed'||el.getAttribute('role')==='dialog')){el.style.setProperty('display','none','important');openAuth()}})}
new MutationObserver(()=>hideLegacyAuth()).observe(document.body,{subtree:true,childList:true});setTimeout(hideLegacyAuth,300);setTimeout(hideLegacyAuth,1200);
(async()=>{const t=localStorage.getItem(TOKEN);if(!t||localStorage.getItem(USER))return;try{const r=await api('/takhfid/api/v2/auth/me');if(r.user)localStorage.setItem(USER,JSON.stringify(r.user))}catch(e){localStorage.removeItem(TOKEN);localStorage.removeItem(USER)}})();
</script>
<script type="module" src="./assets/index-Co2L1R-b.js"></script>
</body>
</html>
