name: Build SHOPIK Flutter Native

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./shopik_flutter
        run: |
          flutter pub get

      - name: Run Flutter Static Analysis
        working-directory: ./shopik_flutter
        run: |
          flutter analyze --no-fatal-infos

      - name: Prepare Android Signing Configuration
        working-directory: ./shopik_flutter/android
        run: |
          if [ ! -f key.properties ] && [ -f key.properties.example ]; then
            cp key.properties.example key.properties
          fi

      - name: Build Release APK
        working-directory: ./shopik_flutter
        run: |
          flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}

      - name: Build Release App Bundle (AAB)
        working-directory: ./shopik_flutter
        run: |
          flutter build appbundle --release --build-name=1.0.0 --build-number=${{ github.run_number }}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopik-release-apk
          path: shopik_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopik-release-aab
          path: shopik_flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
