name: Unpack uploaded project ZIP

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'اسم ملف ZIP الموجود في جذر المستودع (اتركه فارغاً لاختيار أول ملف ZIP)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: find_zip
        shell: bash
        env:
          INPUT_ZIP: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_ZIP}" ]]; then
            ZIP_FILE="${INPUT_ZIP}"
            [[ -f "${ZIP_FILE}" ]] || { echo "ZIP file not found: ${ZIP_FILE}"; exit 1; }
          else
            mapfile -t ZIPS < <(find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort)
            if [[ ${#ZIPS[@]} -eq 0 ]]; then
              echo 'لم يتم العثور على أي ملف ZIP في جذر المستودع.'
              exit 1
            fi
            ZIP_FILE="${ZIPS[0]}"
            echo "Using first ZIP: ${ZIP_FILE}"
          fi

          echo "zip=${ZIP_FILE}" >> "$GITHUB_OUTPUT"

      - name: Validate archive
        shell: bash
        env:
          ZIP_FILE: ${{ steps.find_zip.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -t "$ZIP_FILE"

      - name: Extract into repository root
        shell: bash
        env:
          ZIP_FILE: ${{ steps.find_zip.outputs.zip }}
        run: |
          set -euo pipefail

          rm -rf .unpack_tmp
          mkdir -p .unpack_tmp

          # Extract outside the repository first, then copy the project safely.
          unzip -q "$ZIP_FILE" -d .unpack_tmp

          # Prevent accidental zip-slip paths.
          if find .unpack_tmp -type f -name '*.zip' -o -type f -path '*/../*' | grep -q .; then
            echo 'Invalid archive contents detected.'
            exit 1
          fi

          mapfile -t TOP_ENTRIES < <(find .unpack_tmp -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # Remove the current project contents but preserve Git metadata and this workflow.
          while IFS= read -r entry; do
            [[ -z "$entry" ]] && continue
            case "$entry" in
              .git|.github|.unpack_tmp|"$ZIP_FILE") continue ;;
            esac
            rm -rf -- "$entry"
          done < <(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # If the ZIP contains one top-level directory, use its contents as the project root.
          if [[ ${#TOP_ENTRIES[@]} -eq 1 && -d ".unpack_tmp/${TOP_ENTRIES[0]}" ]]; then
            rsync -a --exclude='.git' --exclude='.github' ".unpack_tmp/${TOP_ENTRIES[0]}/" ./
          else
            rsync -a --exclude='.git' --exclude='.github' .unpack_tmp/ ./
          fi

          rm -rf .unpack_tmp
          rm -f -- "$ZIP_FILE"

      - name: Show resulting project tree
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Root ==='
          find . -maxdepth 2 -type f ! -path './.git/*' | sort | head -n 250
          echo '=== package.json ==='
          if [[ -f package.json ]]; then
            sed -n '1,220p' package.json
          else
            echo 'package.json not found'
          fi

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git commit -m 'chore: unpack uploaded project archive'
          git push origin HEAD:main
