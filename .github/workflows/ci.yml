name: Check storefront

on:
  push:
    branches: [fix-flask-auth-migration-step1]
  pull_request:
    branches: [main, backup-before-original-ui-flask-2026-09-14]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install
      - run: bun run lint
      - run: bun run build
