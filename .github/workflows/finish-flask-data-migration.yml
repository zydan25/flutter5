name: Finish Flask data migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch customer app data flows without changing UI
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/App.tsx')
          s = p.read_text()
          if "from './api'" not in s:
              s = s.replace("import { Flame, Sparkles, MessageCircle, ChevronLeft } from 'lucide-react';", "import { Flame, Sparkles, MessageCircle, ChevronLeft } from 'lucide-react';\nimport { fetchCurrentUser, getFlaskContent, getFlaskOrders, getFlaskProducts } from './api';")
          s = s.replace("const [categories] = useState<Category[]>(INITIAL_CATEGORIES);", "const [categories, setCategories] = useState<Category[]>(INITIAL_CATEGORIES);")
          s = s.replace("const [banners] = useState<Banner[]>(INITIAL_BANNERS);", "const [banners, setBanners] = useState<Banner[]>(INITIAL_BANNERS);")
          marker = "  // Global helper to open trends with a specific hashtag"
          if "getFlaskProducts<Product>()" not in s:
              block = '''  // Flask is the runtime source of catalog, content, session and orders.\n  useEffect(() => {\n    let active = true;\n    void getFlaskProducts<Product>().then((items) => { if (active && items.length) setProducts(items); }).catch((error) => console.warn('Flask products load failed:', error));\n    void getFlaskContent().then((content) => {\n      if (!active) return;\n      if (content.categories?.length) setCategories(content.categories as Category[]);\n      if (content.banners?.length) setBanners(content.banners as Banner[]);\n      if (content.campaigns?.length) setCampaigns(content.campaigns as TrendCampaign[]);\n    }).catch((error) => console.warn('Flask content load failed:', error));\n    void fetchCurrentUser().then((current) => { if (active && current) setUser(current as User); }).catch((error) => console.warn('Flask session load failed:', error));\n    return () => { active = false; };\n  }, []);\n\n  useEffect(() => {\n    if (!user) return;\n    let active = true;\n    const loadOrders = async () => { try { const items = await getFlaskOrders(); if (active) setOrders(items as Order[]); } catch (error) { console.warn('Flask orders load failed:', error); } };\n    void loadOrders();\n    const timer = window.setInterval(loadOrders, 5000);\n    return () => { active = false; window.clearInterval(timer); };\n  }, [user?.uid]);\n\n'''
              s = s.replace(marker, block + marker)
          p.write_text(s)

          p = Path('src/components/AdminModal.tsx')
          s = p.read_text()
          s = s.replace("import { fetchAllUsersFromFirestore, deleteUserFromFirestore, updateOrderStatusInFirestore } from '../firebase';", "import { deleteFlaskCustomer, getFlaskCustomers, updateFlaskOrderStatus } from '../api';")
          s = s.replace('fetchAllUsersFromFirestore', 'getFlaskCustomers')
          s = s.replace('deleteUserFromFirestore', 'deleteFlaskCustomer')
          s = s.replace('updateOrderStatusInFirestore', 'updateFlaskOrderStatus')
          s = s.replace('firestoreUsers', 'customers').replace('setFirestoreUsers', 'setCustomers')
          s = s.replace('isLoadingUsers', 'isLoadingCustomers').replace('setIsLoadingUsers', 'setIsLoadingCustomers')
          s = s.replace('العملاء وفايربيس', 'العملاء من الخادم').replace('العملاء المسجلين في فايربيس', 'العملاء المسجلين في Flask')
          s = s.replace('مزامنة حية مع مجموعة users في Firestore', 'بيانات العملاء من قاعدة Flask').replace('جاري تحميل العملاء من فايربيس...', 'جاري تحميل العملاء من Flask...')
          p.write_text(s)
          PY

      - name: Remove obsolete Firebase source trees
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src/admin-app src/customer-app
          rm -f src/shared/firebase.ts src/firebase.ts

      - name: Verify source and dependency are Firebase-free
        shell: bash
        run: |
          set -euo pipefail
          if grep -n '"firebase"' package.json; then exit 1; fi
          matches=$(grep -RInEi "firebase|firestore|firebase-admin" src --exclude='*.map' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi

      - name: Build and commit
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: complete storefront data migration to Flask'
          git push origin HEAD:main

      - name: Remove this one-time workflow
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finish-flask-data-migration.yml
          git add -A
          git commit -m 'chore: remove one-time Flask migration workflow'
          git push origin HEAD:main
