name: Deploy original UI to GitHub Pages

on:
  push:
    branches: [original-ui-flask-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: original-ui-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean build
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/assets
          cp index.html manifest.json sw.js apple-touch-icon.png favicon.ico favicon.png icon-192.png icon-512.png icon-maskable-512.png icon-maskable.svg icon.svg site/
          cp assets/* site/assets/
          test -s site/index.html
          test -s site/assets/index-Co2L1R-b.js
          test -s site/assets/index-DqlAnH_M.css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
