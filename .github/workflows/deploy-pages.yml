name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare customer-app legacy UI
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -R customer-app/. dist/

          # GitHub Pages serves this repository under /flutter5/.
          # The legacy customer bundle uses root-relative asset URLs, so rewrite them.
          if [ -f dist/index.html ]; then
            sed -i 's#src="/assets/#src="/flutter5/assets/#g; s#href="/assets/#href="/flutter5/assets/#g; s#href="/manifest.json"#href="/flutter5/manifest.json"#g' dist/index.html
          fi

          if [ -f dist/manifest.json ]; then
            sed -i 's#"start_url": "/"#"start_url": "/flutter5/"#; s#"scope": "/"#"scope": "/flutter5/"#; s#"src": "/#"src": "/flutter5/#g' dist/manifest.json
          fi

          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
