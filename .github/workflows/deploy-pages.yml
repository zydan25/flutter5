name: Build and Deploy SHOPIK to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shopik-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout clean build
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies from package.json
        shell: bash
        run: |
          set -euo pipefail
          rm -f bun.lock bun.lockb
          bun install --no-save

      - name: Build production bundle
        run: bun run build

      - name: Verify production output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          test "$(find dist/assets -type f -name '*.js' | wc -l)" -ge 1
          test "$(find dist/assets -type f -name '*.css' | wc -l)" -ge 1
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
