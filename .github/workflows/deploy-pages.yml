name: Deploy Customer App Pages

on:
  push:
    branches: [customer-app-pages-2026-09-14]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-customer-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prepare customer app
        run: |
          set -euo pipefail
          test -f customer-app/index.html
          test -f customer-app/assets/index-customer.js
          test -f customer-app/assets/index-DqlAnH_M.css
          rm -rf dist-pages
          mkdir -p dist-pages/assets
          cp customer-app/assets/index-customer.js dist-pages/assets/index-Co2L1R-b.js
          cp customer-app/assets/index-DqlAnH_M.css dist-pages/assets/
          cp customer-app/index.html dist-pages/index.html
          cp dist-pages/index.html dist-pages/404.html
          for f in manifest.json icon.svg icon-192.png icon-512.png apple-touch-icon.png favicon.png; do
            if test -f "customer-app/$f"; then cp "customer-app/$f" "dist-pages/$f"; fi
          done

      - name: Verify Pages artifact
        run: |
          set -euo pipefail
          test -s dist-pages/index.html
          test -s dist-pages/assets/index-Co2L1R-b.js
          test -s dist-pages/assets/index-DqlAnH_M.css
          test -s dist-pages/404.html
          grep -Eq 'src="(\./)?assets/index-Co2L1R-b\.js"' dist-pages/index.html
          grep -Eq 'href="(\./)?assets/index-DqlAnH_M\.css"' dist-pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
