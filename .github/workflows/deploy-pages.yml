name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare dist from original dist_backup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          cp -a dist_backup dist

          # GitHub Pages serves this repository under /flutter5/.
          # The original bundle uses root-relative URLs, so rewrite its
          # HTML/manifest/service-worker references for the project path.
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('dist/index.html'),
              Path('dist/manifest.json'),
              Path('dist/sw.js'),
          ]
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              replacements = {
                  'href="/assets/': 'href="/flutter5/assets/',
                  'src="/assets/': 'src="/flutter5/assets/',
                  'src: "/': 'src: "/flutter5/',
                  "src: '/": "src: '/flutter5/",
                  "'/index.html'": "'/flutter5/index.html'",
                  '"/index.html"': '"/flutter5/index.html"',
                  "'/manifest.json'": "'/flutter5/manifest.json'",
                  '"/manifest.json"': '"/flutter5/manifest.json"',
                  "'/icon-192.png'": "'/flutter5/icon-192.png'",
                  '"/icon-192.png"': '"/flutter5/icon-192.png"',
                  "'/icon-512.png'": "'/flutter5/icon-512.png'",
                  '"/icon-512.png"': '"/flutter5/icon-512.png"',
                  "'/icon-maskable-512.png'": "'/flutter5/icon-maskable-512.png'",
                  '"/icon-maskable-512.png"': '"/flutter5/icon-maskable-512.png"',
                  "'/apple-touch-icon.png'": "'/flutter5/apple-touch-icon.png'",
                  '"/apple-touch-icon.png"': '"/flutter5/apple-touch-icon.png"',
                  "'/icon.svg'": "'/flutter5/icon.svg'",
                  '"/icon.svg"': '"/flutter5/icon.svg"',
                  "'/favicon.png'": "'/flutter5/favicon.png'",
                  '"/favicon.png"': '"/flutter5/favicon.png"',
                  "'/favicon.ico'": "'/flutter5/favicon.ico'",
                  '"/favicon.ico"': '"/flutter5/favicon.ico"',
                  "'/'": "'/flutter5/'",
                  '"/"': '"/flutter5/"',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          cp dist/index.html dist/404.html
          echo "Prepared dist from dist_backup"
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
