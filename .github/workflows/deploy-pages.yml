name: Deploy Customer App Pages

on:
  push:
    branches: [clean-source-pages-2026-09-14]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-customer-app
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build from React source
        run: bun run build

      - name: Verify fresh build
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/assets/*.js
          test -s dist/assets/*.css
          grep -q '<div id="root"></div>' dist/index.html
          grep -q 'src/main.tsx' index.html
          if grep -RqiE 'firebase|firestore|firebaseapp' dist; then
            echo 'Firebase reference found in fresh customer build'
            exit 1
          fi

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          rm -rf dist-pages
          cp -R dist dist-pages
          cp dist/index.html dist-pages/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
