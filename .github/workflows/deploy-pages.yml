name: Deploy Customer App Pages

on:
  push:
    branches: [clean-source-pages-2026-09-14]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-customer-app
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build from React source
        run: bun run build

      - name: Verify fresh build
        run: |
          set -euo pipefail
          test -s dist/index.html
          find dist/assets -type f -name '*.js' -size +0c | grep -q .
          find dist/assets -type f -name '*.css' -size +0c | grep -q .
          grep -q '<div id="root"></div>' dist/index.html
          test -f index.html
          grep -q 'src/main.tsx' index.html

          echo '--- Built asset entry ---'
          sed -n '1,80p' dist/index.html

          echo '--- Firebase-related strings in fresh bundle (diagnostic only) ---'
          grep -RniE 'firebaseapp\.com|firebaseio\.com|firebase/(auth|firestore|storage)|initializeApp\(|getFirestore\(|firebaseConfig|firestore' dist || true

          if grep -RqiE 'firebaseapp\.com|firebaseio\.com|firebase/(auth|firestore|storage)|initializeApp\(|getFirestore\(|firebaseConfig|firestore' dist; then
            echo 'Real Firebase runtime reference found in fresh customer build'
            exit 1
          fi

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          rm -rf dist-pages
          cp -R dist dist-pages
          cp dist/index.html dist-pages/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
