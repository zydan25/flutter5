name: Deploy Customer App Pages

on:
  push:
    branches: [clean-source-pages-2026-09-14]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-customer-app
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build from React source
        run: bun run build

      - name: Verify clean source build
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s index.html
          find dist/assets -type f -name '*.js' -size +0c | grep -q .
          find dist/assets -type f -name '*.css' -size +0c | grep -q .
          grep -q '<div id="root"></div>' dist/index.html
          grep -q 'src/main.tsx' index.html
          test "$(find dist/assets -maxdepth 1 -type f -name '*.js' | wc -l)" -ge 1
          test "$(find dist/assets -maxdepth 1 -type f -name '*.css' | wc -l)" -ge 1
          if grep -RqiE 'firebaseapp\.com|firebaseio\.com|initializeApp\(|getFirestore\(|firebaseConfig|firestore' dist/assets; then
            echo 'Firebase runtime reference found in emitted JS/CSS'
            exit 1
          fi
          if find dist -type f \( -name 'index-Co2L1R-b.js' -o -name 'index-customer.js' -o -name 'index-admin.js' \) | grep -q .; then
            echo 'Stale prebuilt application asset found in fresh dist'
            exit 1
          fi
          echo 'Fresh build verification passed.'
          sed -n '1,40p' dist/index.html

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          rm -rf dist-pages
          cp -R dist dist-pages
          cp dist/index.html dist-pages/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
