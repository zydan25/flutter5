name: Deploy Customer App Pages

on:
  push:
    branches: [customer-app-pages-2026-09-14]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-customer-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prepare customer app
        run: |
          test -f customer-app/index.html
          test -f customer-app/assets/index-Co2L1R-b.js
          test -f customer-app/assets/index-DqlAnH_M.css
          cp customer-app/index.html customer-app/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: customer-app

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
