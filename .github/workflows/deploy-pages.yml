name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare dist from original dist_backup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          cp -a dist_backup dist

          # GitHub Pages serves this repository under /flutter5/.
          # The original bundle uses root-relative URLs, so rewrite its
          # HTML/manifest/service-worker references for the project path.
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('dist/index.html'),
              Path('dist/404.html'),
              Path('dist/manifest.json'),
              Path('dist/sw.js'),
          ]
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('href="/assets/', 'href="/flutter5/assets/')
              text = text.replace('src="/assets/', 'src="/flutter5/assets/')
              text = text.replace('src: "/', 'src: "/flutter5/')
              text = text.replace("src: '/", "src: '/flutter5/")
              text = text.replace("'/index.html'", "'/flutter5/index.html'")
              text = text.replace("'/'", "'/flutter5/'")
              text = text.replace('"/index.html"', '"/flutter5/index.html"')
              text = text.replace('"/manifest.json"', '"/flutter5/manifest.json"')
              text = text.replace('"/icon-192.png"', '"/flutter5/icon-192.png"')
              text = text.replace('"/icon-512.png"', '"/flutter5/icon-512.png"')
              text = text.replace('"/icon-maskable-512.png"', '"/flutter5/icon-maskable-512.png"')
              text = text.replace('"/apple-touch-icon.png"', '"/flutter5/apple-touch-icon.png"')
              text = text.replace('"/icon.svg"', '"/flutter5/icon.svg"')
              text = text.replace('"/favicon.png"', '"/flutter5/favicon.png"')
              path.write_text(text, encoding='utf-8')

          # GitHub Pages SPA fallback.
          (Path('dist/index.html')).replace(Path('dist/404.html'))
          print('Prepared dist from dist_backup')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
